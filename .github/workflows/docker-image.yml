name: Docker Image CI

# Only checks that the image builds, images are pushed by the release workflow, see publish-pypi.yml
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set env variables
        run: |
          SIGNALBLAST_VERSION=$(uvx hatch version)
          echo "the version is $SIGNALBLAST_VERSION"
          echo "SIGNALBLAST_VERSION=$SIGNALBLAST_VERSION" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: SIGNALBLAST_VERSION=${{ env.SIGNALBLAST_VERSION }}
          push: false
