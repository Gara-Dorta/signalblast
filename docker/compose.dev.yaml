# Publishes signal-cli-rest-api on localhost:8080, so that signalblast can be run outside docker with `uv run signalblast`
# and SIGNALBLAST_SIGNAL_SERVICE=localhost:8080.
# Only for development, add it after docker-compose.yaml:
#   docker compose -f docker-compose.yaml -f docker/compose.dev.yaml up signal-cli-rest-api
services:
  signal-cli-rest-api:
    ports:
      - "127.0.0.1:8080:8080"
