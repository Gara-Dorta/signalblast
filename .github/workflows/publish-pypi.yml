name: Release

# Runs the tests, then publishes the package to TestPyPI and PyPI and the image to Docker Hub
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Run the tests
    uses: ./.github/workflows/test-code.yml

  build:
    name: Build the package distributions
    needs: test
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: latest

    - name: Build the wheel and the source dist
      run: uv build

    - name: Upload the distributions
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  testpypi:
    name: Upload release to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/signalblast
    permissions:
      id-token: write
    steps:

    - name: Download the distributions
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Publish package distributions to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Upload release to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/signalblast
    permissions:
      id-token: write
    steps:

    - name: Download the distributions
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: Push the image to Docker Hub
    needs: pypi
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set env variables
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        # The release tags are v<version>, e.g. v1.2.3
        SIGNALBLAST_VERSION="${RELEASE_TAG#v}"
        # Replace the + for a -, as + is not a valid docker tag
        DOCKER_TAG="${SIGNALBLAST_VERSION//+/-}"
        echo "the version is $SIGNALBLAST_VERSION"
        echo "the docker version is $DOCKER_TAG"
        echo "SIGNALBLAST_VERSION=$SIGNALBLAST_VERSION" >> "$GITHUB_ENV"
        echo "DOCKER_TAG=$DOCKER_TAG" >> "$GITHUB_ENV"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push the image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        build-args: SIGNALBLAST_VERSION=${{ env.SIGNALBLAST_VERSION }}
        push: true
        tags: |
          eradorta/signalblast:${{ env.DOCKER_TAG }}
          eradorta/signalblast:latest
