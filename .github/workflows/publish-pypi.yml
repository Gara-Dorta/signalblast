name: Release

# Checks that the release tag is signed, runs the tests and the reproducibility check, then publishes the package to TestPyPI and PyPI and the image to Docker Hub
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Run the tests
    uses: ./.github/workflows/test-code.yml

  reproducibility:
    name: Check that the builds are reproducible
    uses: ./.github/workflows/reproducibility.yml

  tag:
    name: Check that the release tag is signed
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # Catches releases made from an unsigned tag, e.g. one created in the GitHub UI.
    # Users check the tag against their own copy of allowed_signers with scripts/verify-release.sh
    - name: Verify the tag signature
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        # The checkout can replace an annotated tag with a plain ref, so fetch the tag object itself
        git fetch --quiet --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        git -c gpg.ssh.allowedSignersFile=.github/allowed_signers verify-tag "$RELEASE_TAG"

  testpypi:
    name: Upload release to TestPyPI
    needs: [test, reproducibility, tag]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/signalblast
    permissions:
      id-token: write
    steps:

    # Published from the reproducibility check, so these are exactly the files it checked
    - name: Download the distributions
      uses: actions/download-artifact@v8
      with:
        name: build-1
        path: build/

    - name: Publish package distributions to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: build/dist/
        repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Upload release to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/signalblast
    permissions:
      id-token: write
    steps:

    # Published from the reproducibility check, so these are exactly the files it checked
    - name: Download the distributions
      uses: actions/download-artifact@v8
      with:
        name: build-1
        path: build/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: build/dist/

  checksums:
    name: Attach the checksums to the release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

    # Published from the reproducibility check, so these are exactly the files it checked
    - name: Download the distributions
      uses: actions/download-artifact@v8
      with:
        name: build-1
        path: build/

    - name: Upload SHA256SUMS
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        (cd build/dist && sha256sum -- *) > SHA256SUMS
        cat SHA256SUMS
        gh release upload "$RELEASE_TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY"

  docker:
    name: Push the image to Docker Hub
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to sign the attestation with the workflow's identity
      id-token: write
      attestations: write
    env:
      IMAGE: eradorta/signalblast
    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set env variables
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        # The release tags are v<version>, e.g. v1.2.3
        SIGNALBLAST_VERSION="${RELEASE_TAG#v}"
        # Replace the + for a -, as + is not a valid docker tag
        DOCKER_TAG="${SIGNALBLAST_VERSION//+/-}"
        echo "the version is $SIGNALBLAST_VERSION"
        echo "the docker version is $DOCKER_TAG"
        echo "SIGNALBLAST_VERSION=$SIGNALBLAST_VERSION" >> "$GITHUB_ENV"
        echo "DOCKER_TAG=$DOCKER_TAG" >> "$GITHUB_ENV"
        # Use the commit time instead of the current time, so that the build is reproducible, buildx reads it from the env
        echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push the image
      id: push
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        build-args: SIGNALBLAST_VERSION=${{ env.SIGNALBLAST_VERSION }}
        # rewrite-timestamp sets the file times in the layers to SOURCE_DATE_EPOCH
        outputs: type=image,push=true,oci-mediatypes=true,rewrite-timestamp=true
        tags: |
          ${{ env.IMAGE }}:${{ env.DOCKER_TAG }}
          ${{ env.IMAGE }}:latest

    # Signs that the image was built by this workflow, verify it with `gh attestation verify`, see scripts/verify-release.sh
    - name: Attest the image
      uses: actions/attest-build-provenance@v4.2.2
      with:
        subject-name: index.docker.io/${{ env.IMAGE }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
