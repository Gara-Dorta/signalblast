services:
  signal-cli-rest-api:
    # Pinned by digest so that scripts/verify-container.sh can check that this exact image runs, dependabot keeps it up to date
    image: "bbernhard/signal-cli-rest-api:0.101@sha256:2cf09d66a86fdd210e42ee91662216364acc27da1163a8c44167a77ea3a6559a"
    # Fixed name so that docker/watchdog.sh and scripts/verify-container.sh can find it
    container_name: signal-cli-rest-api
    volumes:
      - "$HOME/.local/share/signal-api:/home/.local/share/signal-cli"
    environment:
      - MODE=json-rpc
      - JSON_RPC_TRUST_NEW_IDENTITIES=always
    security_opt:
      - no-new-privileges:true
    # Needed with no-new-privileges, the image runs as 1000:1000 and s6 has to write to /run
    tmpfs:
      - /run:exec,size=64m,uid=1000,gid=1000,mode=0755
    restart: always

  signalblast:
    image: "eradorta/signalblast:${DOCKER_TAG:-latest}"
    # Fixed name so that docker/watchdog.sh can restart it
    container_name: signalblast
    build:
      args:
        SIGNALBLAST_VERSION: ${SIGNALBLAST_VERSION:-}
    volumes:
      - "$HOME/.local/share/signalblast/:/home/user/.local/share/signalblast/"
    environment:
      # Required, the rest are optional and default to empty so that compose doesn't warn about them
      - SIGNALBLAST_PHONE_NUMBER=$SIGNALBLAST_PHONE_NUMBER
      - SIGNALBLAST_PASSWORD=${SIGNALBLAST_PASSWORD:-}
      - SIGNALBLAST_HEALTHCHECK_RECEIVER=${SIGNALBLAST_HEALTHCHECK_RECEIVER:-}
      - SIGNALBLAST_INSTRUCTIONS_URL=${SIGNALBLAST_INSTRUCTIONS_URL:-}
      - SIGNALBLAST_EXPIRATION_TIME=${SIGNALBLAST_EXPIRATION_TIME:-}
      - SIGNALBLAST_SIGNAL_SERVICE=${SIGNALBLAST_SIGNAL_SERVICE:-}
      - SIGNALBLAST_HEALTHCHECK_PORT=${SIGNALBLAST_HEALTHCHECK_PORT:-}
      - SIGNALBLAST_LOG_LEVEL=${SIGNALBLAST_LOG_LEVEL:-}
      - SIGNALBLAST_LOG_FILE=${SIGNALBLAST_LOG_FILE:-}
      - TZ=${TZ:-}
    security_opt:
      - no-new-privileges:true
    depends_on:
      signal-cli-rest-api:
        condition: service_healthy
    restart: always
