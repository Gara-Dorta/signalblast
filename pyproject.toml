[project]
name = "signalblast"
dynamic = ["version"]
description = "Broadcast bot for Signal"
authors = [{name = "Gara Dorta"}]
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3",
]
keywords = [
  "Signal",
  "Bot",
  "Broadcast",
]
dependencies = [
    "bcrypt>=5.0.0",
    "pydantic>=2.13.4",
    "signalbot>=2.0.0",
]

[dependency-groups]
dev = [
    "hatch>=1.18.0",
    "prek>=0.4.13",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff==0.14.14",
]

# [tool.uv.sources]
# signalbot = { path = "../signalbot", editable = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",   # Docstrings
  "FIX", # TODO, FIXME and other messages
  "ERA001", # Commented out code
]

[tool.ruff.lint.per-file-ignores]
"src/signalblast/migrate_csv_to_db.py" = ["T201"] # CLI script reports progress via print
"tests/*" = ["S101", "INP001"] # assert is how pytest checks; tests dir has no __init__.py
