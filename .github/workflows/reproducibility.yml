name: Reproducible Builds

# Builds the package distributions and the image twice on different runners and checks that they are identical.
# Images are pushed by the release workflow, see publish-pypi.yml
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows the release workflow to run the check before publishing
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.runner }})
    strategy:
      matrix:
        # Vary the environment so that anything leaking into the build shows up as a difference
        include:
          - runner: ubuntu-24.04
            umask: "022"
            tz: UTC
          - runner: ubuntu-22.04
            umask: "077"
            tz: Asia/Tokyo
    runs-on: ${{ matrix.runner }}
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Clone the code with a different umask
        run: |
          umask ${{ matrix.umask }}
          git clone --quiet --no-local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/src"

      - name: Set env variables
        working-directory: ${{ runner.temp }}/src
        run: |
          SIGNALBLAST_VERSION=$(uvx hatch version)
          echo "the version is $SIGNALBLAST_VERSION"
          echo "SIGNALBLAST_VERSION=$SIGNALBLAST_VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build the wheel and the source dist
        working-directory: ${{ runner.temp }}/src
        run: uv build --build-constraint build-constraints.txt --require-hashes --out-dir "$RUNNER_TEMP/out/dist"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        working-directory: ${{ runner.temp }}/src
        run: |
          docker buildx build --no-cache \
            --platform linux/amd64,linux/arm64 \
            --build-arg SIGNALBLAST_VERSION="$SIGNALBLAST_VERSION" \
            --provenance=false \
            --output type=oci,dest="$RUNNER_TEMP/out/image.tar",rewrite-timestamp=true \
            .

      - name: Compute the hashes
        working-directory: ${{ runner.temp }}/out
        run: |
          (cd dist && sha256sum *) > hashes.txt
          # Per-platform image digests, these are the ones to compare against the published images
          index=$(tar -xOf image.tar index.json | jq -r '.manifests[0].digest')
          tar -xOf image.tar "blobs/sha256/${index#sha256:}" \
            | jq -r '.manifests[] | "\(.digest)  image \(.platform.os)/\(.platform.architecture)"' >> hashes.txt
          cat hashes.txt

      - name: Upload the build outputs
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.runner }}
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error

  compare:
    name: Compare the builds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the build outputs
        uses: actions/download-artifact@v8

      - name: Compare the hashes
        run: diff -u build-ubuntu-24.04/hashes.txt build-ubuntu-22.04/hashes.txt

      - name: Install uv
        if: failure()
        uses: astral-sh/setup-uv@v10.2.0

      - name: Show the differences in the distributions
        if: failure()
        run: |
          # The images are not diffed here, download the artifacts and use https://github.com/reproducible-containers/diffoci
          for file in build-ubuntu-24.04/dist/*; do
            uvx diffoscope "$file" "build-ubuntu-22.04/dist/$(basename "$file")" || true
          done
