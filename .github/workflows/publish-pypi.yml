name: Release

# Checks that the release tag is signed, runs the tests and the reproducibility check, then publishes the package to TestPyPI and PyPI and the image to Docker Hub
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Run the tests
    uses: ./.github/workflows/test-code.yml

  reproducibility:
    name: Check that the builds are reproducible
    uses: ./.github/workflows/reproducibility.yml

  tag:
    name: Check that the release tag is signed
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # Catches releases made from an unsigned tag, e.g. one created in the GitHub UI.
    # Users check the tag against their own copy of allowed_signers with scripts/verify-release.sh
    - name: Verify the tag signature
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        # The checkout can replace an annotated tag with a plain ref, so fetch the tag object itself
        git fetch --quiet --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        git -c gpg.ssh.allowedSignersFile=.github/allowed_signers verify-tag "$RELEASE_TAG"

  testpypi:
    name: Upload release to TestPyPI
    needs: [test, reproducibility, tag]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/signalblast
    permissions:
      id-token: write
    steps:

    # Published from the reproducibility check, so these are exactly the files it checked
    - name: Download the distributions
      uses: actions/download-artifact@v8
      with:
        name: build-1
        path: build/

    - name: Publish package distributions to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: build/dist/
        repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Upload release to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/signalblast
    permissions:
      id-token: write
    steps:

    # Published from the reproducibility check, so these are exactly the files it checked
    - name: Download the distributions
      uses: actions/download-artifact@v8
      with:
        name: build-1
        path: build/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: build/dist/

  checksums:
    name: Attach the checksums and the image digests to the release
    needs: [pypi, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

    # Published from the reproducibility check, so these are exactly the files it checked
    - name: Download the distributions
      uses: actions/download-artifact@v8
      with:
        name: build-1
        path: build/

    # The digests are not in SHA256SUMS, as they are not hashes of files and would break `sha256sum -c`
    - name: Upload SHA256SUMS and IMAGE-DIGESTS
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        IMAGE_REF: ${{ needs.docker.outputs.ref }}
        INDEX_DIGEST: ${{ needs.docker.outputs.digest }}
      run: |
        {
          echo "${INDEX_DIGEST}  ${IMAGE_REF}"
          awk -v ref="$IMAGE_REF" '$2 == "image" {print $1 "  " ref " " $3}' build/hashes.txt
        } > build/IMAGE-DIGESTS
        cat build/IMAGE-DIGESTS
        gh release upload "$RELEASE_TAG" build/SHA256SUMS build/IMAGE-DIGESTS --repo "$GITHUB_REPOSITORY"

  docker:
    name: Push the image to Docker Hub
    needs: pypi
    runs-on: ubuntu-latest
    outputs:
      # The pushed image and the digest of its index, listed in IMAGE-DIGESTS by the checksums job
      ref: ${{ steps.push.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      # Needed to sign the attestation with the workflow's identity
      id-token: write
      attestations: write
    env:
      IMAGE: eradorta/signalblast
    steps:

    # Pushed from the reproducibility check, so this is exactly the image it checked
    - name: Download the image
      uses: actions/download-artifact@v8
      with:
        name: image-1

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push the image
      id: push
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        # The release tags are v<version>, e.g. v1.2.3, and the + is replaced for a -, as + is not a valid docker tag
        DOCKER_TAG="${RELEASE_TAG#v}"
        DOCKER_TAG="${DOCKER_TAG//+/-}"
        for tag in "$DOCKER_TAG" latest; do
          # skopeo reads the login from the docker config, --preserve-digests fails instead of pushing a modified image
          skopeo copy --all --preserve-digests --digestfile digest.txt \
            oci-archive:image.tar "docker://docker.io/${IMAGE}:${tag}"
        done
        echo "ref=${IMAGE}:${DOCKER_TAG}" >> "$GITHUB_OUTPUT"
        echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

    # Signs that the image was built by this workflow, verify it with `gh attestation verify`, see scripts/verify-release.sh
    - name: Attest the image
      uses: actions/attest-build-provenance@v4.2.2
      with:
        subject-name: index.docker.io/${{ env.IMAGE }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
